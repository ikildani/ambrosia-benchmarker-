name: CI                                                                             
on:                                                                                  
    push:                                                                              
      branches: [main]                                                                 
    pull_request:                                                                      
      branches: [main]                                                                                                                                                    
jobs:                                                                                
    test:                                                                              
      name: Test                                                                       
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm run lint                                                            
          continue-on-error: true                                                      
        - run: npm test -- --ci --coverage                                             
                                                                                       
    accuracy-gate:
      name: Deal-terms accuracy gate
      runs-on: ubuntu-latest
      timeout-minutes: 5
      # Offline and secret-free: prices the committed fixture (data/backtest/terms-backtest-fixture.json) with its
      # committed calibration rows and fails when overall within-2x falls by more than 1 point or MdAE(log) rises by
      # more than 0.02 against data/backtest/terms-backtest-baseline.json. To change the baseline on purpose:
      #   npx tsx scripts/terms-backtest.ts --fixture data/backtest/terms-backtest-fixture.json --write-baseline
      # then commit the baseline in the same PR and explain the change in the PR body.
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - run: npm ci
        - name: Offline backtest vs committed baseline
          run: npx tsx scripts/terms-backtest.ts --fixture data/backtest/terms-backtest-fixture.json --check data/backtest/terms-backtest-baseline.json
          env:
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

    build:                                                                             
      name: Build                                                                      
      runs-on: ubuntu-latest                                                           
      needs: test                                                                      
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        # Placeholder Supabase settings: the build must not reach the production
        # database, so queries fail fast against a closed local port and pages take
        # their no-data path instead of throwing "Missing Supabase environment variables".
        - run: npm run build
          env:
            NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
            NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder'
            SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder'
                                                                                       
    security:                                                                          
      name: Security Audit                                                             
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm audit --audit-level=high                                            
          continue-on-error: true                                                                       
