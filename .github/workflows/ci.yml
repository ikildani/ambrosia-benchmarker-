name: CI                                                                             
on:                                                                                  
    push:                                                                              
      branches: [main]                                                                 
    pull_request:                                                                      
      branches: [main]                                                                                                                                                    
jobs:                                                                                
    test:                                                                              
      name: Test                                                                       
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm run lint                                                            
          continue-on-error: true                                                      
        - run: npm test -- --ci --coverage                                             
                                                                                       
    build:                                                                             
      name: Build                                                                      
      runs-on: ubuntu-latest                                                           
      needs: test                                                                      
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        # Placeholder Supabase settings: the build must not reach the production
        # database, so queries fail fast against a closed local port and pages take
        # their no-data path instead of throwing "Missing Supabase environment variables".
        - run: npm run build
          env:
            NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
            NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder'
            SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder'
                                                                                       
    security:                                                                          
      name: Security Audit                                                             
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm audit --audit-level=high                                            
          continue-on-error: true                                                                       
