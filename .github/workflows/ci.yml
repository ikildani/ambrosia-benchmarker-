name: CI                                                                             
on:                                                                                  
    push:                                                                              
      branches: [main]                                                                 
    pull_request:                                                                      
      branches: [main]                                                                                                                                                    
jobs:                                                                                
    test:                                                                              
      name: Test                                                                       
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm run lint                                                            
          continue-on-error: true                                                      
        - run: npm test -- --ci --coverage                                             
                                                                                       
    build:                                                                             
      name: Build                                                                      
      runs-on: ubuntu-latest                                                           
      needs: test                                                                      
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm run build                                                           
          # Pages query Supabase at build time; placeholders let the clients
          # construct so queries fail softly (real values live in Vercel only).
          env:
            NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
            SUPABASE_SERVICE_ROLE_KEY: placeholder
                                                                                       
    security:                                                                          
      name: Security Audit                                                             
      runs-on: ubuntu-latest                                                           
      steps:                                                                           
        - uses: actions/checkout@v4                                                    
        - uses: actions/setup-node@v4                                                  
          with:                                                                        
            node-version: '20'                                                         
            cache: 'npm'                                                               
        - run: npm ci                                                                  
        - run: npm audit --audit-level=high                                            
          continue-on-error: true                                                                       
